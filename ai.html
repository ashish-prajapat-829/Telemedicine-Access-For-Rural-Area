<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Symptom Checker | Nabha Healthcare</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="back" href="./index.html">←</a>
    <h1 data-i18n="ai.title">AI Symptom Checker</h1>
    <div class="lang-switcher">
      <select id="langSelect">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
      </select>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 data-i18n="ai.enter">Enter Symptoms</h2>
      <textarea id="aiSymptoms" rows="4" placeholder="Headache, fever..."></textarea>
      <div class="actions">
        <button class="btn" id="startVoice" data-i18n="ai.voice">Voice Input</button>
        <button class="btn btn-secondary" onclick="runAISymptomCheck()" data-i18n="ai.check">Check</button>
      </div>
      <div id="aiResults" class="note"></div>
    </section>
  </main>

  <footer class="footer">© Nabha Healthcare</footer>

  <script src="./i18n/i18n.js" defer></script>
  <script src="./main.js" defer></script>
  <script src="./ai.js" defer></script>
</body>
</html>
